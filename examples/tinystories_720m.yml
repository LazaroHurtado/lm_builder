context_length: 256
embedding_dimension: 768
attention_config:
  qk_positional_embedding:
    type: RotaryPE
  num_heads: 12
  attn_dropout: 0.1
  resid_dropout: 0.1
  bias: true
  norm:
    type: LayerNorm
    bias: true
  layers:
    - type: CausalMultiHeadAttention
ffn_config:
  type: MixtureOfExperts
  intermediate_dimension: 3072
  num_experts: 4
  top_k: 2
  num_shared_experts: 1
  dropout: 0.1
  activation_fn: GELU
  bias: true
  norm:
    type: LayerNorm
    bias: true
norm:
  type: LayerNorm
  bias: true
vocab_size: 50257
num_layers: 17
dropout: 0.1
